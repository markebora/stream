name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ['stream-setup/**', 'index.html', '.github/workflows/build-windows.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder (the one with package.json + main.js)
        run: |
          DIR=""
          for f in $(find stream-setup -name package.json -not -path "*/node_modules/*"); do
            d=$(dirname "$f")
            if [ -f "$d/main.js" ] && grep -q '"electron-builder"' "$f"; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then echo "::error::No app folder with package.json and main.js found inside stream-setup"; exit 1; fi
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "App folder: $DIR"

      - name: Use the root index.html (same file Vercel serves) inside the app
        run: |
          if [ -f index.html ]; then mkdir -p "$APP_DIR/public"; cp index.html "$APP_DIR/public/index.html"; echo "Copied root index.html"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build the installer
        working-directory: ${{ env.APP_DIR }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Upload installer (download it from the run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Disciples-Stream-Windows-Installer
          path: ${{ env.APP_DIR }}/dist/*.exe
          if-no-files-found: error

      - name: Publish a release (only when you push a tag like v1.0.1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/dist/*.exe
